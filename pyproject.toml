[project]
name = "consortium"
version = "0.1.0"
description = "Federated bid assembly — SF330 compliance without disclosing private libraries"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "flwr[simulation]>=1.34.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Ruff formats fenced Python in Markdown. The brief's code blocks are illustration, not
# code, and reformatting them churns a doc four people are reading.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.flwr.app]
publisher = "consortium"

[tool.flwr.app.components]
serverapp = "backend.server_app:app"
clientapp = "backend.client_app:app"

[tool.flwr.app.config]
num-rounds = 3
tau = 0.6
section-f-cap = 10


