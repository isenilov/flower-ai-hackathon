[project]
name = "consortium"
version = "0.3.1"
# Hub renders this as the app description, so it carries the team too; `flwr app publish`
# stops to ask above 200 characters, which would hang `make publish`.
description = "A collaborative disclosure harness for agents that cannot pool their data. Team Axomic: Vyacheslav Lukin, Ivan Senilov."
readme = "README.md"
# A table with a file, not an SPDX string: fab-format-version 1 requires the file form.
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "flwr[simulation]>=1.34.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Ruff formats fenced Python in Markdown. The brief's code blocks are illustration, not
# code, and reformatting them churns a doc four people are reading.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.flwr.app]
# Must equal the Flower account name exactly, and the app name below cannot change after
# the first publication. Published as @i53n1/consortium.
publisher = "i53n1"
fab-format-version = 1
# Tracks uv.lock, so what Hub builds against is what we test against locally. `uv sync`
# reverts any out-of-band upgrade to this, so bump the lock first if you raise it.
flwr-version-target = "1.34.0"
# Hub keeps only .py/.toml/.md/.yaml/.json/.jsonl and LICENSE, and once any user rule is
# set every surviving file must match that list — hence .gitignore here. The rest is
# excluded so the published app is the harness, not our desk.
fab-exclude = [
    ".gitignore",
    "CLAUDE.md",
    ".claude/**",
    "docs/**",
    "frontend/**",
    "tests/**",
]

# Hub rejects a mixed bundle — 422 "must contain either only 'agentapp' or exactly
# 'serverapp' and 'clientapp'". The local CLI validates all three happily, so this only
# surfaces at publish time. `serverapp` / `clientapp` stay in the repo as modules; the
# federated surface runs via `flwr.simulation.run_simulation`, not `flwr run .`.
[tool.flwr.app.components]
agentapp = "backend.agent_app:app"

[tool.flwr.app.config]
num-rounds = 3
num-firms = 3
tau = 0.6
section-f-cap = 10
# The model a judge's run gets when they pass no run-config, so it has to be one SuperGrid
# itself serves — the shared endpoints in docs/event.md belong to a SuperLink you run
# yourself, and their ids come back `400 not a valid model ID` there. Empty is still a
# supported mode: round 1 runs, round 2 finds nothing, and the gap stays open honestly.
model = "openai/gpt-5.5"
# Which corpus a run stands on. `backend.agent_app` has always read this key; until it was
# declared here, `--run-config scenario=...` was rejected and only the environment could set
# it. Empty uses the manifest default.
scenario = ""
# Put the trace in the run's log, as JSON behind a sentinel, so a page on the operator's
# machine can follow a run happening somewhere it cannot see the filesystem of. Off by
# default: a local run writes `frontend/state/trace.jsonl` directly and the extra lines would
# only clutter the demo pane. `make harness` and `make grid` set it and read the other end of
# the pipe with `python -m backend.trace`. See backend/trace.py.
trace-to-log = false

[tool.flwr.app.config.agent]
input = ""


